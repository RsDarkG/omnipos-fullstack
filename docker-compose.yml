version: '3.8'
services:
  postgres-pos:
    image: postgres:16-alpine
    container_name: omnipos_db
    environment:
      POSTGRES_DB: omnipos
      POSTGRES_USER: pos_admin
      POSTGRES_PASSWORD: pos_password_2026
    ports:
      - "5432:5432"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
